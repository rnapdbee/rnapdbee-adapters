services:
  adapters:
    build: ./
    restart: on-failure
    ports:
      - 8000:80
    environment:
      - ADAPTERS_CACHE_TYPE=RedisCache
      - ADAPTERS_FLASK_LOG_LEVEL=INFO
      - ADAPTERS_REDIS_URL=redis://redis:6379/0
      - CLI2REST_BARNABA_URL=http://load-balancer/cli2rest-barnaba
      - CLI2REST_BPNET_URL=http://load-balancer/cli2rest-bpnet
      - CLI2REST_FR3D_URL=http://load-balancer/cli2rest-fr3d
      - CLI2REST_INKSCAPE_URL=http://load-balancer/cli2rest-inkscape
      - CLI2REST_MAXIT_URL=http://load-balancer/cli2rest-maxit
      - CLI2REST_MCANNOTATE_URL=http://load-balancer/cli2rest-mc-annotate
      - CLI2REST_RCHIE_URL=http://load-balancer/cli2rest-rchie
      - CLI2REST_RNAVIEW_URL=http://load-balancer/cli2rest-rnaview
    depends_on:
      load-balancer:
        condition: service_healthy
      redis:
        condition: service_started

  load-balancer:
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      cli2rest-barnaba:
        condition: service_healthy
      cli2rest-bpnet:
        condition: service_healthy
      cli2rest-fr3d:
        condition: service_healthy
      cli2rest-inkscape:
        condition: service_healthy
      cli2rest-maxit:
        condition: service_healthy
      cli2rest-mc-annotate:
        condition: service_healthy
      cli2rest-rchie:
        condition: service_healthy
      cli2rest-rnaview:
        condition: service_healthy
      cli2rest-rnapolis:
        condition: service_healthy
      cli2rest-varna-tz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      start_period: 30s
      start_interval: 1s
    restart: on-failure

  cli2rest-barnaba:
    image: ghcr.io/tzok/cli2rest-barnaba
    deploy:
      replicas: 3
    restart: on-failure

  cli2rest-bpnet:
    image: ghcr.io/tzok/cli2rest-bpnet
    deploy:
      replicas: 3
    restart: on-failure

  cli2rest-fr3d:
    image: ghcr.io/tzok/cli2rest-fr3d
    deploy:
      replicas: 3
    restart: on-failure

  cli2rest-inkscape:
    image: ghcr.io/tzok/cli2rest-inkscape
    deploy:
      replicas: 2
    restart: on-failure

  cli2rest-maxit:
    image: ghcr.io/tzok/cli2rest-maxit
    deploy:
      replicas: 3
    restart: on-failure

  cli2rest-mc-annotate:
    image: ghcr.io/tzok/cli2rest-mc-annotate
    deploy:
      replicas: 3
    restart: on-failure

  cli2rest-rchie:
    image: ghcr.io/tzok/cli2rest-rchie
    deploy:
      replicas: 3
    restart: on-failure

  cli2rest-rnaview:
    image: ghcr.io/tzok/cli2rest-rnaview
    deploy:
      replicas: 3
    restart: on-failure

  cli2rest-rnapolis:
    image: ghcr.io/tzok/cli2rest-rnapolis
    deploy:
      replicas: 3
    restart: on-failure

  cli2rest-varna-tz:
    image: ghcr.io/tzok/cli2rest-varna-tz
    deploy:
      replicas: 3
    restart: on-failure

  redis:
    image: redis:7-alpine
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
