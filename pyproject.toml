[project]
name = "rnapdbee-adapters"
version = "1.0.0"
description = "REST API adapters for RNA bioinformatics tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.16"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "cli2rest-bio @ git+https://github.com/tzok/cli2rest-bio@0.4.6",
    "dataclasses-json",
    "flask",
    "flask-caching",
    "gunicorn",
    "logomaker",
    "lxml",
    "matplotlib",
    "mmcif",
    "orjson",
    "redis",
    "rnapolis",
]

[dependency-groups]
test = [
    "pylint",
]

[tool.uv]
# Compile the cross-version lock file with:
#    uv lock
# Export a pip-compatible lock file with:
#    uv export --format requirements-txt --no-dev --no-emit-project -o requirements.txt
