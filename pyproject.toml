[project]
name = "rnapdbee-adapters"
version = "1.0.0"
description = "REST API adapters for RNA bioinformatics tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.16"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[tool.uv]
# Runtime dependencies are declared in requirements.in and compiled into a
# universal lock file (requirements.txt) that installs on every supported
# Python version. See the header of that file for the compile command.
