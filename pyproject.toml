[project]
name = "rnapdbee-adapters"
version = "1.0.0"
description = "REST API adapters for RNA bioinformatics tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.16"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "cli2rest-bio @ git+https://github.com/tzok/cli2rest-bio@0.4.6",
    "dataclasses-json",
    "flask",
    "flask-caching",
    "gunicorn",
    "logomaker",
    "lxml",
    "matplotlib",
    "mmcif",
    "orjson",
    "redis",
    "rnapolis",
]

[dependency-groups]
test = [
    "pylint",
    "pytest",
]

[tool.uv]
# Dependencies are declared in [project.dependencies] and locked in uv.lock.
# Refresh the lock with:
#    uv lock
# Install the runtime environment with:
#    uv sync --frozen
# Install the runtime and test environments with:
#    uv sync --frozen --group test
