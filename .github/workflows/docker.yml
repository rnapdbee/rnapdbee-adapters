name: Docker Image CI v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      DOCKER_IMAGE: rnapdbee-image
      DOCKER_CONTAINER: rnapdbee-container

    steps:
      - uses: actions/checkout@v7

      - name: Build the docker image
        run: docker build -t $DOCKER_IMAGE .

  lint:
    runs-on: ubuntu-22.04
    if: ${{ github.actor != 'dependabot[bot]' }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          # No version: setup-uv reads tool.uv.required-version from
          # pyproject.toml, keeping a single source of truth.
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Analyze with pylint
        run: uv run --frozen --group test pylint --rcfile pylintrc src/

  auto-merge-dependabot-non-major-updates:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      pull-requests: write
      contents: write
      checks: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for Dependabot PRs
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
